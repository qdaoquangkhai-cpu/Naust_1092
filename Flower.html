<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower - Dành tặng người thương</title>
    <!-- Font chữ mềm mại dễ thương -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/panbapz/anh/refs/heads/main/icon1.png" type="image/png">
    
    <style>
        *,*::after,*::before{padding:0;margin:0;box-sizing:border-box;}
        :root{--dark-color:#0b1019;--fl-speed:0.8s;}
        body{display:flex;align-items:flex-end;justify-content:center;min-height:100vh;background-color:var(--dark-color);overflow:hidden;perspective:1000px;font-family:"Mali",cursive;margin:0;}
        
        /* Hiệu ứng hoa */
        .flowers{position:relative;transform:scale(0.7) translateZ(0);z-index:2;transition:opacity 1s ease;}
        .flower{position:absolute;bottom:18vmin;transform-origin:bottom center;z-index:50;}
        .flower--1{animation:moving-flower-1 4s ease-in-out infinite;}
        .flower--1 .flower__line{height:70vmin;animation-delay:0.3s;}
        .flower--2{left:50%;transform:rotate(20deg);animation:moving-flower-2 4s ease-in-out infinite;}
        .flower--2 .flower__line{height:60vmin;animation-delay:0.6s;}
        .flower--3{left:50%;transform:rotate(-15deg);animation:moving-flower-3 4s ease-in-out infinite;}
        .flower--3 .flower__line{animation-delay:0.9s;}
        .flower--4{left:-25%;z-index:-6;transform:rotate(10deg);animation:moving-flower-4 3.5s ease-in-out infinite;}
        .flower--4 .flower__line{height:90vmin;}
        .flower--5{left:75%;z-index:-7;transform:rotate(-25deg);animation:moving-flower-5 4.5s ease-in-out infinite;}
        .flower--5 .flower__line{height:85vmin;}

        .flower__leafs{position:relative;animation:blooming-flower 2s backwards;}
        .flower__leafs::after{content:"";position:absolute;left:0;top:0;transform:translate(-50%,-100%);width:8vmin;height:8vmin;background-color:#df5353;filter:blur(10vmin);}
        .flower__leaf{position:absolute;bottom:0;left:50%;width:9vmin;height:15vmin;background:radial-gradient(circle at 50% 20%,#ffe0e2 0%,#ffb3bd 30%,#e65f75 55%,#aa3d42 80%,#962d36 100%);border-radius:50% 50% 40% 40% / 60% 60% 40% 40%;transform-origin:bottom center;opacity:0.97;border:1.5px solid #ac3e3e;box-shadow:0 0 1vmin #e65f6a,inset 0 0 1.5vmin #cc4f5f;}
        .flower__leaf--1{transform:translate(-50%,-5%) rotate(-22deg);}
        .flower__leaf--2{transform:translate(-50%,-5%) rotate(22deg);}
        .flower__leaf--3{transform:translate(-50%,-10%) rotate(0deg);}
        .flower__leaf--4,.flower__leaf--5,.flower__leaf--6{width:7vmin;height:12vmin;background:radial-gradient(circle at 50% 20%,#ffe0e2 0%,#ffb3bd 30%,#e65f75 55%,#aa3d42 80%,#962d36 100%);opacity:0.96;border:1px solid #cc616a;box-shadow:0 0 0.8vmin #ffb3b9;}
        .flower__leaf--4{transform:translate(-50%,-8%) rotate(-10deg);}
        .flower__leaf--5{transform:translate(-50%,-8%) rotate(10deg);}
        .flower__leaf--6{transform:translate(-50%,-12%) rotate(0deg);}
        .flower__center{position:absolute;left:-2vmin;top:-2vmin;width:4vmin;height:4vmin;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffb3b9 0%,#ff334e 80%,#330003 100%);box-shadow:0 0 1vmin #ffb3cc;}
        .flower__line{height:55vmin;width:2vmin;background-image:linear-gradient(to top,transparent 10%,#2d5016,#4a7c23,#6b8e23);animation:grow-flower-tree 4s backwards;}
        .flower__line__leaf{--w:8vmin;--h:calc(var(--w) + 3vmin);position:absolute;top:20%;left:90%;width:var(--w);height:var(--h);border-top-right-radius:var(--h);border-bottom-left-radius:var(--h);background-image:linear-gradient(to top,rgba(45,80,22,0.6),#4a7c23,#6b8e23);}
        .flower__line__leaf--1{transform:rotate(70deg) rotateY(30deg);}
        .flower__line__leaf--2{top:45%;transform:rotate(70deg) rotateY(30deg);}
        .flower__line__leaf--3,.flower__line__leaf--4{border-top-right-radius:0;border-bottom-left-radius:0;border-top-left-radius:var(--h);border-bottom-right-radius:var(--h);left:-460%;top:12%;transform:rotate(-70deg) rotateY(30deg);}
        .flower__line__leaf--4{top:40%;}

        .special-text{position:fixed;top:8%;left:50%;transform:translateX(-50%);color:#ff3e6e;font-size:32px;font-weight:600;text-shadow:0 0 16px #ff0022;z-index:10;text-align:center;animation:glowText 2s infinite alternate;}
        @keyframes glowText{0%{text-shadow:0 0 10px #ff3e6e;}100%{text-shadow:0 0 30px #ff5a83;}}
        @keyframes moving-flower-1{0%,100%{transform:rotate(2deg);}50%{transform:rotate(-2deg);}}
        @keyframes moving-flower-2{0%,100%{transform:rotate(18deg);}50%{transform:rotate(14deg);}}
        @keyframes moving-flower-3{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(-20deg);}}
        @keyframes moving-flower-4{0%,100%{transform:rotate(9deg);}50%{transform:rotate(12deg);}}
        @keyframes moving-flower-5{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(-11deg);}}
        @keyframes grow-flower-tree{0%{height:0;}}
        @keyframes blooming-flower{0%{transform:scale(0);}}

        .ramo{position:absolute;bottom:0vmin;left:50%;transform:translateX(-50%);z-index:0;opacity:0;transition:opacity 1.2s ease;}
        .ramo--visible{opacity:1;}
        .ramo img{width:60vmin;height:auto;display:block;}

        /* Nút phong thư */
        .btn-letter{display:none;position:fixed;bottom:50px;left:50%;transform:translateX(-50%);width:130px;height:130px;background:url("https://raw.githubusercontent.com/panbapz/anh/refs/heads/main/letter.png") no-repeat center/contain;border:none;cursor:pointer;transition:transform 0.3s ease;z-index:1000;}
        .btn-letter:hover{transform:translateX(-50%) scale(1.1);}
        
        /* Hộp thư */
        .letter-box{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:1100;}
        .letter-content{background:#fffafc;border-radius:18px;padding:30px;width:90%;max-width:400px;text-align:center;box-shadow:0 0 25px rgba(255,182,193,0.9);display:flex;flex-direction:column;align-items:center;}
        .letter-content h2{color:#ff3e6e;margin-bottom:15px;font-size:26px;}
        .letter-content p{color:#222;font-size:16px;line-height:1.6;margin-bottom:10px;}
        .letter-sign{margin-top:15px;width:100%;text-align:right;font-style:italic;color:#ff6b81;font-size:15px;}
        .btn-next{margin-top:20px;padding:10px 22px;background:linear-gradient(135deg,#ff6584,#ff3e6e);color:white;border:none;border-radius:25px;font-size:15px;cursor:pointer;font-family:"Mali",cursive;box-shadow:0 4px 15px rgba(255,62,110,0.5);}

        /* Màn hình mở đầu */
        #pantalla-inicial{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background:radial-gradient(circle at center, #1b2130 0%, #080c14 100%);position:fixed;top:0;left:0;z-index:300;}
        .header-text{font-size:2.4em;color:#ff5277;font-weight:700;text-align:center;margin-bottom:20px;}
        .gift-image{max-width:70%;max-height:45vh;border-radius:20px;cursor:pointer;box-shadow:0 0 25px #ff3d4d88;transition:transform 0.3s;}
        .gift-image:hover{transform:scale(1.05);}
        .instruction-text{margin-top:18px;font-size:1.3em;color:#ff85a1;font-style:italic;}

        /* Ảnh sticker bay */
        #continuous-flying-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1200;display:none;}
        .flying-item{position:absolute;bottom:-150px;max-height:110px;object-fit:contain;animation:slowFlyUp linear infinite;pointer-events:auto;cursor:pointer;}
        @keyframes slowFlyUp{0%{transform:translateY(0) scale(var(--scale-val)) rotate(var(--rot-start));opacity:0;}15%{opacity:var(--opacity-val);}85%{opacity:var(--opacity-val);}100%{transform:translateY(calc(-100vh - 250px)) scale(var(--scale-val)) rotate(var(--rot-end));opacity:0;}}
        
        #image-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:1300;cursor:pointer;}
        #modal-img{max-width:85vw;max-height:85vh;border-radius:16px;box-shadow:0 0 30px white;}
    </style>
</head>
<body>

    <!-- MÀN HÌNH MỞ ĐẦU: Nhấp vào hoa để phát nhạc và mở trang -->
    <div id="pantalla-inicial">
        <div class="header-text">Gửi tặng em một bó hoa 🌷</div>
        <div class="image-container">
            <img id="btn-devpan" src="./Flower_files/anhz.png" alt="Ảnh hoa" class="gift-image" onerror="this.src='https://raw.githubusercontent.com/panbapz/anh/refs/heads/main/anhz.png'">
            <div class="instruction-text">Chạm vào hoa nhé ❤️</div>
        </div>
        <!-- LINK NHẠC: Bạn có thể đổi link bài hát ở đây -->
        <audio id="audio-ms" src="https://raw.githubusercontent.com/panbapz/nhacz/main/a10.mp3" loop></audio>
    </div>

    <!-- MÀN HÌNH HOA NỞ -->
    <div id="contenido-principal" style="display: none;">
        <!-- DÒNG CHỮ TRÊN BÔNG HOA (Bạn có thể sửa câu này) -->
        <div class="special-text" id="special-text">Chúc em luôn rạng rỡ và hạnh phúc ❤️</div>

        <div class="flowers" id="flowers-wrapper">
            <div class="flower flower--1"><div class="flower__leafs flower__leafs--1"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__leaf flower__leaf--5"></div><div class="flower__leaf flower__leaf--6"></div><div class="flower__center"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div></div></div>
            <div class="flower flower--2"><div class="flower__leafs flower__leafs--2"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__leaf flower__leaf--5"></div><div class="flower__leaf flower__leaf--6"></div><div class="flower__center"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div></div></div>
            <div class="flower flower--3"><div class="flower__leafs flower__leafs--3"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__leaf flower__leaf--5"></div><div class="flower__leaf flower__leaf--6"></div><div class="flower__center"></div></div><div class="flower__line"><div class="flower__line__leaf flower__line__leaf--1"></div><div class="flower__line__leaf flower__line__leaf--2"></div><div class="flower__line__leaf flower__line__leaf--3"></div><div class="flower__line__leaf flower__line__leaf--4"></div></div></div>
            <div class="flower flower--4"><div class="flower__leafs flower__leafs--4"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__leaf flower__leaf--5"></div><div class="flower__leaf flower__leaf--6"></div><div class="flower__center"></div></div><div class="flower__line"></div></div>
            <div class="flower flower--5"><div class="flower__leafs flower__leafs--5"><div class="flower__leaf flower__leaf--1"></div><div class="flower__leaf flower__leaf--2"></div><div class="flower__leaf flower__leaf--3"></div><div class="flower__leaf flower__leaf--4"></div><div class="flower__leaf flower__leaf--5"></div><div class="flower__leaf flower__leaf--6"></div><div class="flower__center"></div></div><div class="flower__line"></div></div>
        </div>

        <div class="ramo" id="ramo-wrapper">
            <img src="./Flower_files/bhoa.png" alt="Ramo de flores" onerror="this.src='https://raw.githubusercontent.com/panbapz/anh/refs/heads/main/bhoa.png'">
        </div>
    </div>

    <!-- Nút phong thư -->
    <button id="btn-letter" class="btn-letter"></button>

    <!-- HỘP THƯ LỜI CHÚC (Bạn tự do chỉnh sửa câu chữ ở đây) -->
    <div id="letter-box" class="letter-box">
        <div id="letter-content" class="letter-content">
            <!-- 1. Tiêu đề thư -->
            <h2>Happy Birthday Minh Nhiên nha :3 ❤️</h2>
            
            <!-- 2. Lời chúc của bạn -->
            <p>Hú gâu khẹc bruh bullying  ọc ọc óc ocs!</p>
            
            <!-- 3. Ký tên -->
            <div class="letter-sign">Hú hú Khẹc Khẹc ( mèo )  ❤️</div>
            
            <button id="btn-next-action" class="btn-next">Xem tiếp ✨</button>
        </div>
    </div>

    <!-- Khu vực ảnh bay lơ lửng -->
    <div id="continuous-flying-container"></div>
    <div id="image-modal"><img id="modal-img" src="" alt="Phóng to"></div>

    <script>
        // Danh sách ảnh sticker bay lên
        const FLYING_IMAGES = [
            "./Flower_files/ju14w.webp",
            "./Flower_files/mgge5.webp",
            "./Flower_files/sqw0o.webp",
            "./Flower_files/xc69b.webp"
        ];

        const audio = document.getElementById('audio-ms');
        const pantallaInicial = document.getElementById('pantalla-inicial');
        const contenidoPrincipal = document.getElementById('contenido-principal');
        const btnDevpan = document.getElementById('btn-devpan');
        const btnLetter = document.getElementById('btn-letter');
        const letterBox = document.getElementById('letter-box');
        const btnNext = document.getElementById('btn-next-action');
        const specialText = document.getElementById('special-text');
        const flowersWrapper = document.getElementById('flowers-wrapper');
        const ramoWrapper = document.getElementById('ramo-wrapper');
        const flyingContainer = document.getElementById('continuous-flying-container');
        const imageModal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');

        // Bấm vào ảnh mở đầu để kích hoạt hoa & nhạc
        btnDevpan.addEventListener('click', () => {
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Âm thanh sẵn sàng'));
            }
            pantallaInicial.style.display = 'none';
            contenidoPrincipal.style.display = 'block';
            ramoWrapper.classList.add('ramo--visible');
            setTimeout(() => {
                btnLetter.style.display = 'inline-block';
            }, 1800);
        });

        // Bấm phong thư để hiện lời chúc
        btnLetter.addEventListener('click', () => {
            letterBox.style.display = 'flex';
        });

        // Đóng thư khi chạm ra ngoài
        letterBox.addEventListener('click', (e) => {
            if (e.target === letterBox) letterBox.style.display = 'none';
        });

        // Bấm Xem tiếp để ảnh bay lên
        btnNext.addEventListener('click', (e) => {
            e.preventDefault();
            letterBox.style.display = 'none';
            btnLetter.style.display = 'none';
            specialText.style.opacity = '0';
            flowersWrapper.style.opacity = '0';
            ramoWrapper.style.opacity = '0';

            flyingContainer.style.display = 'block';
            startFlyingAnimation();
        });

        function startFlyingAnimation() {
            const lanes = 5;
            let lastLane = -1;
            setInterval(() => {
                const count = Math.random() < 0.4 ? 2 : 1;
                for (let i = 0; i < count; i++) {
                    const img = document.createElement('img');
                    img.src = FLYING_IMAGES[Math.floor(Math.random() * FLYING_IMAGES.length)];
                    img.className = 'flying-item';

                    let lane;
                    do { lane = Math.floor(Math.random() * lanes); } while (lane === lastLane);
                    lastLane = lane;

                    const laneWidth = 100 / lanes;
                    const leftPos = lane * laneWidth + (Math.random() * (laneWidth - 15) + 5);
                    img.style.left = leftPos + '%';

                    const scale = Math.random() * 0.5 + 0.5;
                    const duration = Math.random() * 2 + 5;
                    img.style.setProperty('--scale-val', scale);
                    img.style.setProperty('--blur-val', (1 - scale) * 3.5 + 'px');
                    img.style.setProperty('--opacity-val', scale * 0.3 + 0.7);
                    img.style.setProperty('--sway-x', (Math.random() - 0.5) * 60 + 'px');
                    img.style.setProperty('--rot-start', (Math.random() - 0.5) * 20 + 'deg');
                    img.style.setProperty('--rot-end', (Math.random() - 0.5) * 30 + 'deg');
                    img.style.zIndex = Math.floor(scale * 10);
                    img.style.animationDuration = duration + 's';

                    img.onclick = (ev) => {
                        ev.stopPropagation();
                        modalImg.src = img.src;
                        imageModal.style.display = 'flex';
                    };

                    flyingContainer.appendChild(img);
                    setTimeout(() => img.remove(), duration * 1000);
                }
            }, 800);
        }

        imageModal.onclick = () => imageModal.style.display = 'none';
    </script>
</body>
</html>
